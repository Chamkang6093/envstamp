[build-system]
requires = ['hatchling >= 1.26']
build-backend = 'hatchling.build'

[tool.hatch.build.targets.wheel]
packages = ["envstamp"]

[project]
name = "envstamp"
version = "0.1.0"
description = "Atomic runtime state records and reproducible Python distribution fingerprints."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Cham" },
]
keywords = ["runtime-state", "fingerprint", "reproducibility"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.urls]
Repository = "https://github.com/Chamkang6093/envstamp"
