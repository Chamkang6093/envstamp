[build-system]
requires = ['hatchling >= 1.26']
build-backend = 'hatchling.build'

[tool.hatch.build.targets.wheel]
packages = ["envstamp"]

[project]
name = "envstamp"
version = "0.1.3"
description = "Atomic, reproducible fingerprints of installed Python distributions."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Cham" },
]
keywords = ["installed-packages", "version-tracking", "content-hashing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.scripts]
envstamp = "envstamp.cli:main"

[project.urls]
Repository = "https://github.com/Chamkang6093/envstamp"
